button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 #8f1712;justify-self:center}
button.b:focus-visible{outline:3px solid #fff;outline-offset:3px}
.panel{margin-top:14px;background:var(--card);border-radius:12px;padding:18px 22px;border-left:10px solid var(--red);box-shadow:0 3px 0 #0002;min-height:150px}

.panel ul{margin:6px 0 0;padding-left:20px}.panel li{margin-bottom:5px}

@media (prefers-reduced-motion:reduce){#room.out,#room.in{animation:none}.o.on .i{animation:none}.objs{transition:none}}
</style>

var view=document.getElementById('view'),room=document.getElementById('room'),say=document.getElementById('say'),
panel=document.getElementById('panel'),count=document.getElementById('count'),intro=document.getElementById('intro'),
seen={},total=0,cur=0,busy=false,hero,hx=50,wt,last=0,Y=92;
function rm(){return matchMedia('(prefers-reduced-motion:reduce)').matches}
function mkHero(){hero=document.createElement('div');hero.className='hero';
  hero.innerHTML='<div class="in"><i class="hd"></i><i class="tr"></i><i class="lg"></i><i class="lg r"></i></div>';room.appendChild(hero)}
function place(x,y){hx=x;hero.style.transition='none';hero.style.left=x+'%';hero.style.top=y+'%';void hero.offsetWidth}
function moveTo(x,y,cb){
  clearTimeout(wt);hero.classList.remove('sit');
  var t=rm()?0:Math.max(.3,Math.abs(x-hx)/32);
  hero.classList.toggle('left',x<hx);
  if(!t){place(x,y);if(cb)cb();return}
  hero.style.transition='left '+t+'s linear, top .3s';hero.style.left=x+'%';hero.style.top=y+'%';hx=x;
  hero.classList.add('walk');
  wt=setTimeout(function(){hero.classList.remove('walk');if(cb)cb()},t*1000);
}
R.forEach(function(r){r.o.forEach(function(o){if(!o.deco)total++})});
function flash(){
  if(!rm()){var f=document.createElement('div');f.className='flash';view.appendChild(f);setTimeout(function(){f.remove()},600)}
  var p=document.createElement('div');p.className='pol';
  p.innerHTML='<div class="ph"><div class="mini"><div class="in"><i class="hd"></i><i class="tr"></i><i class="lg"></i><i class="lg r"></i></div></div></div><span>Rakshith</span>';
  view.appendChild(p);setTimeout(function(){p.remove()},6000);
}
function notes(b){
  b.insertAdjacentHTML('beforeend','<i class="nt">🎵</i><i class="nt n2">🎶</i><i class="nt n3">🎵</i>');
  setTimeout(function(){b.querySelectorAll('.nt').forEach(function(n){n.remove()})},2700);
}

      panel.innerHTML='<h2>'+o.title+'</h2>'+(o.when?'<p class="when">'+o.when+'</p>':'')+o.html;
      
      seen[i+'-'+j]=1;b.classList.add('seen');upd();
      if(Object.keys(seen).length===total)say.textContent=o.say+' That was the whole house. Let\'s talk: rohrakh@gmail.com';
      }
    };
    box.appendChild(b);
  });
  room.querySelectorAll('.go').forEach(function(b){b.onclick=function(){walk(cur+Number(b.dataset.d))}});
  say.textContent=r.say;
  mkHero();place(sx==null?50:sx,Y);
}
function walk(i){
  if(busy||i<0||i>=R.length)return;busy=true;last=Date.now();
  var dir=i>cur?1:-1;
  moveTo(dir>0?97:3,Y,function(){
    room.className='out';
    setTimeout(function(){
      draw(i,dir>0?3:97);room.className='in';
      moveTo(50,Y,function(){hero.classList.remove('left');busy=false});
    },rm()?0:350);
  });
}
view.addEventListener('pointermove',function(e){
  var b=view.getBoundingClientRect();
  view.style.setProperty('--lx',((e.clientX-b.left)/b.width-.5)*2);
  view.style.setProperty('--ly',((e.clientY-b.top)/b.height-.5)*2);
});
document.addEventListener('keydown',function(e){
  if(intro.parentNode)return;
  if(e.key==='ArrowRight')walk(cur+1);else if(e.key==='ArrowLeft')walk(cur-1);
});
document.getElementById('start').onclick=function(){
  intro.remove();last=Date.now();
  moveTo(45,Y,function(){hero.classList.remove('left')});
};
setInterval(function(){
  if(busy||intro.parentNode||document.hidden||rm()||hero.classList.contains('walk'))return;
  if(Date.now()-last<6000)return;
  moveTo(30+Math.random()*40,Y);
},4500);
upd();draw(0,4);
})();
</script>
</body>
</html>
