<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rakshith Kumar – Welcome to my home</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--ink:#1d1d1f;--card:#fff;--red:#d7261e;--yellow:#f8c81c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--ink:#f2f2f2;--card:#26282e}}
:root[data-theme="dark"]{--bg:#17181c;--ink:#f2f2f2;--card:#26282e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;line-height:1.45}
main{max-width:900px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:clamp(1.3rem,4.5vw,1.8rem);margin:0}
.count{font-weight:700;background:var(--yellow);color:#1d1d1f;border-radius:8px;padding:2px 12px;box-shadow:0 3px 0 #b08d0a}
#view{position:relative;aspect-ratio:16/10;min-height:300px;overflow:hidden;border-radius:12px;background:#000;border:4px solid #1d1d1f;
--wall:#f1d9b5;--floor:#a06b3b;--ceil:#fff6e6;--lx:0;--ly:0}
#room{position:absolute;inset:0}
#room.out{animation:out .35s ease-in forwards}
#room.in{animation:inn .45s ease-out}
@keyframes out{to{transform:scale(1.5);opacity:0}}
@keyframes inn{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.f{position:absolute;inset:0}
.ceil{background:var(--ceil);clip-path:polygon(0 0,100% 0,78% 20%,22% 20%)}
.floor{background:var(--floor);clip-path:polygon(0 100%,100% 100%,78% 68%,22% 68%);
background-image:repeating-linear-gradient(90deg,#0000 0 60px,#0002 60px 62px)}
.wl{background:var(--wall);filter:brightness(.8);clip-path:polygon(0 0,22% 20%,22% 68%,0 100%)}
.wr{background:var(--wall);filter:brightness(.7);clip-path:polygon(100% 0,78% 20%,78% 68%,100% 100%)}
.bk{background:var(--wall);clip-path:polygon(22% 20%,78% 20%,78% 68%,22% 68%);box-shadow:inset 0 -10px 0 #0002}
.objs{position:absolute;inset:0;transform:translate(calc(var(--lx)*-10px),calc(var(--ly)*-5px));transition:transform .15s}
.o{position:absolute;transform:translate(-50%,-100%);background:none;border:0;cursor:pointer;text-align:center;font:inherit;padding:2px 4px;border-radius:10px;color:#fff}
.o .i{display:block;font-size:clamp(34px,8vw,68px);line-height:1;transition:transform .15s;filter:drop-shadow(0 4px 2px #0006)}
.o:hover .i,.o:focus-visible .i{transform:scale(1.18) rotate(-4deg)}
.o .t{display:inline-block;font-size:clamp(.62rem,1.8vw,.8rem);font-weight:700;background:#fff;color:#1d1d1f;border-radius:6px;padding:0 7px;box-shadow:0 2px 0 #0004;white-space:nowrap}
.o.seen .t::after{content:" ✓"}
.o:focus-visible{outline:3px solid var(--yellow)}
.cert{display:block;position:relative;width:1.7em;height:1.2em;margin:.45em auto 0;background:#fbf6e6;border:.09em solid #6b4423;
box-shadow:0 .06em .12em #0007,inset 0 0 0 .04em #d9c48f;transform-origin:50% -.4em}
.cert::before{content:"";position:absolute;left:50%;top:-.5em;width:.7em;height:.4em;transform:translateX(-50%);
background:linear-gradient(to top right,#0000 46%,#eadfb8 46% 54%,#0000 54%) left/50% 100% no-repeat,linear-gradient(to top left,#0000 46%,#eadfb8 46% 54%,#0000 54%) right/50% 100% no-repeat}
.cert::after{content:"";position:absolute;left:.2em;right:.2em;top:.2em;height:.5em;
background:repeating-linear-gradient(#0000 0 .07em,#8a7a55 .07em .1em)}
.cert b{position:absolute;right:.14em;bottom:.1em;width:.3em;height:.3em;border-radius:50%;background:var(--red);box-shadow:inset 0 -.05em #0003}
.o:hover .cert,.o:focus-visible .cert{animation:sway .5s ease-in-out}
@keyframes sway{25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
.o.on .i{animation:glow 1.1s infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 4px #8cf) brightness(1)}to{filter:drop-shadow(0 0 18px #8cf) brightness(1.3)}}
.go{position:absolute;top:42%;background:var(--yellow);color:#1d1d1f;border:0;border-radius:10px;font:inherit;font-weight:700;padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 #b08d0a;z-index:3}
.go:focus-visible{outline:3px solid #fff}
.go.l{left:8px}.go.r{right:8px}
.hero{position:absolute;width:1em;height:1.8em;font-size:clamp(28px,6vw,46px);transform:translate(-50%,-100%);z-index:2;pointer-events:none;filter:drop-shadow(0 .1em .05em #0005)}
.hero .in{position:relative;width:100%;height:100%;transform-origin:50% 100%}
.hero.left .in{transform:scaleX(-1)}
.hero i{position:absolute;display:block}
.hd{left:.16em;top:0;width:.68em;height:.6em;border-radius:.2em;background:var(--yellow);box-shadow:inset 0 -.09em #0002}
.hd::before{content:"";position:absolute;left:.22em;top:-.1em;width:.24em;height:.1em;border-radius:.09em .09em 0 0;background:var(--yellow)}
.hd::after{content:"";position:absolute;left:.4em;top:.22em;width:.09em;height:.09em;border-radius:50%;background:#1d1d1f;box-shadow:-.2em 0 #1d1d1f}
.tr{left:.08em;top:.6em;width:.84em;height:.62em;border-radius:.1em;background:var(--red);box-shadow:inset 0 -.09em #0003}
.lg{left:.14em;top:1.22em;width:.36em;height:.58em;background:var(--blue);box-shadow:inset 0 -.08em #0003;border-radius:0 0 .05em .05em}
.lg.r{left:.5em}
.hero.walk .lg{animation:step .22s infinite alternate ease-in-out}
.hero.walk .lg.r{animation-direction:alternate-reverse}
.hero.walk .hd,.hero.walk .tr{animation:hop .22s infinite alternate}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-.14em)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-.07em)}}
@media (prefers-reduced-motion:reduce){.hero.walk .lg,.hero.walk .hd,.hero.walk .tr{animation:none}}
.say{position:absolute;left:10px;right:10px;top:10px;background:#fff;color:#1d1d1f;border-radius:14px;padding:10px 14px;font-weight:500;z-index:3;box-shadow:0 3px 0 #0004}
.intro{position:absolute;inset:0;z-index:5;background:#1d1d1fd9;color:#fff;display:grid;place-content:center;text-align:center;gap:12px;padding:20px}
.intro h2{margin:0;font-size:clamp(1.4rem,5vw,2.2rem)}
.intro p{margin:0;opacity:.85}
button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 #8f1712;justify-self:center}
button.b:focus-visible{outline:3px solid #fff;outline-offset:3px}
.panel{margin-top:14px;background:var(--card);border-radius:12px;padding:18px 22px;border-left:10px solid var(--red);box-shadow:0 3px 0 #0002;min-height:150px}
.panel h2{margin:0 0 4px;font-size:1.25rem}
.panel .when{margin:0 0 8px;opacity:.75;font-size:.92rem}
.panel p{margin:0 0 8px}
.panel ul{margin:6px 0 0;padding-left:20px}.panel li{margin-bottom:5px}
.panel a{color:inherit;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--yellow);color:#1d1d1f;border-radius:6px;padding:3px 12px;font-weight:500;box-shadow:inset 0 -3px 0 #0002}
@media (prefers-reduced-motion:reduce){#room.out,#room.in{animation:none}.o.on .i{animation:none}.objs{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Rakshith's home</h1><span class="count" id="count" aria-live="polite"></span></div>
  <div id="view">
    <div id="room"></div>
    <div class="say" id="say"></div>
    <div class="intro" id="intro">
      <h2>Come on in</h2>
      <p>Walk through my home and click things to learn about me.</p>
      <button class="b" id="start">Open the door</button>
    </div>
  </div>
  <section class="panel" id="panel" aria-live="polite"><p>Click anything in the room. Use the yellow arrows to walk to the next room.</p></section>
</main>
<script>
(function(){
var SK=["Strategic Planning & Execution","Program & Project Management","Cross-Functional Stakeholder Management","Market Research & Competitive Intelligence","Business Development & Partnerships","Financial Modelling & Forecasting","Process Improvement & Workflow Automation","Revenue & Growth Planning","Risk & Scenario Analysis","KPI Tracking & Performance Reporting","Client & Account Management","Negotiation"];
var R=[
{name:"Hall",wall:"#f1d9b5",floor:"#a06b3b",ceil:"#fff6e6",say:"Hi, this is my home. Come on in and look around.",
 o:[{x:38,y:72,ico:"🪞",tag:"Mirror",say:"That's me in the mirror. Rakshith Kumar, strategy person.",title:"About me",when:"Strategy & Program Management",
 html:"<p>Strategy professional with 2+ years in Founder's Office and business strategy roles. I drive market research, competitive intelligence, growth planning and cross-functional programs.</p><p>I run several workstreams end to end, from stakeholder alignment and planning to execution, tracking and reporting. I've built financial models, five-year revenue plans, automation workflows and partnerships.</p>"},
 {x:62,y:72,ico:"📬",tag:"Mailbox",say:"Want to say hi? This is the best way to reach me.",title:"Get in touch",when:"",
 html:"<ul><li><a href=\"mailto:rohrakh@gmail.com\">rohrakh@gmail.com</a></li><li><a href=\"tel:+918754619694\">+91 8754619694</a></li></ul>"}]},
{name:"Living room",wall:"#33506f",floor:"#5a3d2b",ceil:"#dfe8f2",say:"This is the living room. It's where I switch off.",
 o:[{x:40,y:72,ico:"📺",tag:"TV",tv:1,say:"This is my TV, where I watch shows and movies. Succession is my favourite.",title:"Now playing: Succession",when:"My all-time favourite show",
 html:"<p>I watch a lot of shows and movies here. Succession is my favourite. A boardroom, a family and a lot of strategy, negotiation and power plays.</p><p>Same skills I use at work, only with much worse family dinners.</p>"},
 {x:66,y:52,ico:"<span class=\"cert\"><b></b></span>",tag:"Degrees",say:"My degrees hang framed on this wall.",title:"Education",when:"",
 html:"<ul><li><b>MBA, Marketing & Strategy</b>, Indian Institute of Management (IIM), Bodh Gaya. 2022–2024.</li><li><b>B.E., Electronics & Communication Engineering</b>, Sri Krishna College of Technology, Coimbatore.</li></ul>"}]},
{name:"Study",wall:"#3a7d63",floor:"#8a6a44",ceil:"#e5f2ea",say:"And this is the study, where the work happens.",
 o:[{x:32,y:72,ico:"💻",tag:"Desk",say:"This is where I work in all of these.",title:"The desk",when:"Core competencies",
 html:"<p>This is where I work in:</p><div class=\"chips\">"+SK.map(function(s){return "<span class=\"chip\">"+s+"</span>"}).join("")+"</div>"},
 {x:46,y:56,ico:"📋",tag:"Whiteboard",say:"The whiteboard is where I plan strategy at Capgen Global.",title:"Strategist, Founder's Office at Capgen Global",when:"Dec 2025 – May 2026 · Bengaluru",
 html:"<ul><li>Run strategic initiatives end to end with the Founder's Office, tracking execution against milestones.</li><li>Lead market research and competitive intelligence for leadership decisions.</li><li>Turn growth strategy into actionable execution plans.</li><li>Build workflow automation that cuts manual process time.</li><li>Lead negotiations for new partnerships and clients.</li><li>Designed an employee appraisal program in Microsoft Forms and Excel.</li><li>Built LBO models across deal scenarios and a returns bridge deck.</li></ul>"},
 {x:60,y:72,ico:"📚",tag:"Bookshelf",say:"My Sify years are on this shelf.",title:"Business Strategist at Sify Technologies Limited",when:"Jul 2024 – Jul 2025 · Chennai",
 html:"<ul><li>Led a company-wide strategy document: vision, mission and a five-year scale-up roadmap.</li><li>Benchmarked competitors and profiled companies for Sify Digital Services.</li><li>Designed a five-year revenue projection and growth model.</li><li>Researched network, cloud, digital apps, cybersecurity and applied AI for new growth areas.</li><li>Structured strategic partnerships and contributed to the Annual Operating Plan.</li><li>Used Porter's Five Forces to assess global expansion.</li><li>Owned account management for B2B IT services clients.</li></ul>"},
 {x:74,y:72,ico:"🗄️",tag:"Cabinet",say:"Where I keep my first research project.",title:"Market Research and Strategy Intern at Driver Logistics",when:"Mar 2023 – Jun 2023 · Coimbatore",
 html:"<ul><li>Ran primary logistics market research across Coimbatore and Tamil Nadu using a structured questionnaire.</li><li>Benchmarked competitors on positioning and service differentiation.</li><li>Applied STP and geographic segmentation to define customer clusters and growth opportunities.</li></ul>"}]}
];
var view=document.getElementById('view'),room=document.getElementById('room'),say=document.getElementById('say'),
panel=document.getElementById('panel'),count=document.getElementById('count'),intro=document.getElementById('intro'),
seen={},total=0,cur=0,busy=false,hero,hx=50,wt,last=0,Y=92;
function rm(){return matchMedia('(prefers-reduced-motion:reduce)').matches}
function mkHero(){hero=document.createElement('div');hero.className='hero';
  hero.innerHTML='<div class="in"><i class="hd"></i><i class="tr"></i><i class="lg"></i><i class="lg r"></i></div>';room.appendChild(hero)}
function place(x,y){hx=x;hero.style.transition='none';hero.style.left=x+'%';hero.style.top=y+'%';void hero.offsetWidth}
function moveTo(x,y,cb){
  clearTimeout(wt);
  var t=rm()?0:Math.max(.3,Math.abs(x-hx)/32);
  hero.classList.toggle('left',x<hx);
  if(!t){place(x,y);if(cb)cb();return}
  hero.style.transition='left '+t+'s linear';hero.style.left=x+'%';hx=x;
  hero.classList.add('walk');
  wt=setTimeout(function(){hero.classList.remove('walk');if(cb)cb()},t*1000);
}
R.forEach(function(r){total+=r.o.length});
function upd(){count.textContent='Explored '+Object.keys(seen).length+' of '+total}
function draw(i,sx){
  var r=R[i];cur=i;
  view.style.setProperty('--wall',r.wall);view.style.setProperty('--floor',r.floor);view.style.setProperty('--ceil',r.ceil);
  var h='<div class="f ceil"></div><div class="f floor"></div><div class="f wl"></div><div class="f wr"></div><div class="f bk"></div><div class="objs" id="objs"></div>';
  if(i>0)h+='<button class="go l" data-d="-1">◀ '+R[i-1].name+'</button>';
  if(i<R.length-1)h+='<button class="go r" data-d="1">'+R[i+1].name+' ▶</button>';
  room.innerHTML=h;
  var box=document.getElementById('objs');
  r.o.forEach(function(o,j){
    var b=document.createElement('button');b.className='o';b.style.left=o.x+'%';b.style.top=o.y+'%';
    if(seen[i+'-'+j])b.classList.add('seen');
    b.innerHTML='<span class="i" aria-hidden="true">'+o.ico+'</span><span class="t">'+o.tag+'</span>';
    b.onclick=function(){
      if(busy)return;
      last=Date.now();say.textContent='Come, let me show you.';
      moveTo(o.x,Y,function(){hero.classList.remove('left');reveal()});
      function reveal(){
      say.textContent=o.say;
      panel.innerHTML='<h2>'+o.title+'</h2>'+(o.when?'<p class="when">'+o.when+'</p>':'')+o.html;
      if(o.tv)b.classList.toggle('on');
      seen[i+'-'+j]=1;b.classList.add('seen');upd();
      if(Object.keys(seen).length===total)say.textContent=o.say+' That was the whole house. Let\'s talk: rohrakh@gmail.com';
      }
    };
    box.appendChild(b);
  });
  room.querySelectorAll('.go').forEach(function(b){b.onclick=function(){walk(cur+Number(b.dataset.d))}});
  say.textContent=r.say;
  mkHero();place(sx==null?50:sx,Y);
}
function walk(i){
  if(busy||i<0||i>=R.length)return;busy=true;last=Date.now();
  var dir=i>cur?1:-1;
  moveTo(dir>0?97:3,Y,function(){
    room.className='out';
    setTimeout(function(){
      draw(i,dir>0?3:97);room.className='in';
      moveTo(50,Y,function(){hero.classList.remove('left');busy=false});
    },rm()?0:350);
  });
}
view.addEventListener('pointermove',function(e){
  var b=view.getBoundingClientRect();
  view.style.setProperty('--lx',((e.clientX-b.left)/b.width-.5)*2);
  view.style.setProperty('--ly',((e.clientY-b.top)/b.height-.5)*2);
});
document.addEventListener('keydown',function(e){
  if(intro.parentNode)return;
  if(e.key==='ArrowRight')walk(cur+1);else if(e.key==='ArrowLeft')walk(cur-1);
});
document.getElementById('start').onclick=function(){
  intro.remove();last=Date.now();
  moveTo(45,Y,function(){hero.classList.remove('left')});
};
setInterval(function(){
  if(busy||intro.parentNode||document.hidden||rm()||hero.classList.contains('walk'))return;
  if(Date.now()-last<6000)return;
  moveTo(30+Math.random()*40,Y);
},4500);
upd();draw(0,4);
})();
</script>
</body>
</html>
